[project]
name = "deal-guardrails"
version = "0.1.0"
description = "Policy-gated deal-desk approval routing: ElevenAgents intake, n8n delivery, Postgres as the only source of truth."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "elevenlabs>=2.0",
    "openai>=1.40",
    "allpairspy>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["policy/tests", "service/tests", "evals/tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 110
target-version = "py312"
